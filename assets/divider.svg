<svg xmlns="http://www.w3.org/2000/svg" width="900" height="22" viewBox="0 0 900 22" font-family="'JetBrains Mono','SF Mono','Cascadia Code','Roboto Mono',Consolas,'Liberation Mono',monospace" role="img">
<defs><linearGradient id="d" x1="0" x2="1" y1="0" y2="0">
